name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a project
        2. Submit feedback with ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ingestion API / anti-spam
        - Widget or hosted page
        - Admin UI
        - Search
        - MCP
        - Deployment (Docker, Coolify)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. 0.1.0 or a commit SHA
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, browser, how you deploy (Docker, Coolify, binary), relevant EARFUL_* settings (never paste secrets)
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server logs or browser console output, if any
      render: text
