[package]
name = "feedback-harvest"
version = "0.1.0"
edition = "2024"
description = "Tiny self-hosted feedback and bug report collector with anti-spam and hybrid search"
license = "MIT"
publish = false

[lib]
name = "feedback_harvest"
path = "src/lib.rs"

[[bin]]
name = "feedback-harvest"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
hex = "0.4.3"
hmac = "0.13.0"
mime_guess = "2.0.5"
# Model2Vec static embeddings. No hf-hub (we download with reqwest) and no
# default tokenizer features: only the pure Rust fancy-regex backend, which
# avoids the oniguruma C and esaxx C++ builds and the progress bar crate.
model2vec-rs = { version = "0.3.0", default-features = false }
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-std", "io-util"] }
tower-http = { version = "0.7.1", features = ["trace", "limit", "set-header", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }
