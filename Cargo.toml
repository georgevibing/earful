[workspace]
resolver = "3"
members = ["crates/server"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Keep hashing fast in debug builds so tests and local dev are not sluggish.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
